<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Real-time Interpretation & Minutes Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header id="appTitle" class="app-title">Real-time Interpretation & Minutes Generator</header>

      <section class="step-card">
        <div class="step-head">
          <span class="step-chip">Step 1</span>
          <h2>Language Selection & Transcription Start</h2>
        </div>

        <div class="language-grid">
          <label class="language-tile" for="meetingLanguage">
            <span>Meeting Language</span>
            <div class="select-wrap">
              <select id="meetingLanguage">
                <option value="ko-KR">Korean</option>
                <option value="en-US" selected>English</option>
                <option value="zh-CN">Chinese</option>
                <option value="ja-JP">Japanese</option>
                <option value="es-ES">Spanish</option>
              </select>
            </div>
          </label>

          <label class="language-tile" for="interpretationLanguage">
            <span>Interpretation Language</span>
            <div class="select-wrap">
              <select id="interpretationLanguage">
                <option value="ko-KR">Korean</option>
                <option value="en-US" selected>English</option>
                <option value="zh-CN">Chinese</option>
                <option value="ja-JP">Japanese</option>
                <option value="es-ES">Spanish</option>
              </select>
            </div>
          </label>

          <label class="language-tile" for="minuteLanguage">
            <span>Minute Language</span>
            <div class="select-wrap">
              <select id="minuteLanguage">
                <option value="ko-KR">Korean</option>
                <option value="en-US" selected>English</option>
                <option value="zh-CN">Chinese</option>
                <option value="ja-JP">Japanese</option>
                <option value="es-ES">Spanish</option>
              </select>
            </div>
          </label>
        </div>

        <div class="control-row">
          <button id="startMeetingBtn" class="start-meeting-btn" type="button">
            <span id="startMeetingLabel">Start Meeting</span>
            <strong id="meetingTimer">00:00.00</strong>
          </button>
          <button id="refreshBtn" class="refresh-btn" type="button" aria-label="Refresh">
            <span aria-hidden="true">&#10227;</span>
          </button>
        </div>

        <p id="statusText" class="status-text">Ready to start.</p>
      </section>

      <section class="step-card">
        <div class="step-head">
          <span class="step-chip">Step 2</span>
          <h2>Real-time Transcription & Translation View</h2>
        </div>

        <div class="transcript-block">
          <label for="meetingTranscript">Meeting Language Transcription</label>
          <textarea id="meetingTranscript" readonly></textarea>
        </div>

        <div class="transcript-block">
          <label for="interpretationTranscript">Interpretation Language Transcription</label>
          <textarea id="interpretationTranscript" readonly></textarea>
        </div>
      </section>

      <section class="step-card">
        <div class="step-head">
          <span class="step-chip">Step 3</span>
          <h2>Generate Minutes & Download PDF</h2>
        </div>

        <div class="minutes-actions">
          <button id="generateMinutesBtn" class="minutes-btn" type="button">
            Start Generating Minutes
          </button>
          <button id="downloadPdfBtn" class="pdf-btn" type="button">Download PDF</button>
        </div>

        <div class="minutes-block">
          <label for="minutesOutput">Minutes</label>
          <article id="minutesOutput" class="minutes-output">No minutes generated yet.</article>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
