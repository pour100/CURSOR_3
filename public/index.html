<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WOOSIK'S MEETING MINUTE GENERATOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-theme="bright">
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="app-shell">
      <header class="card hero">
        <div class="hero-top">
          <div class="theme-switch-wrap">
            <span class="theme-label">Bright</span>
            <button id="themeSwitch" class="theme-switch" aria-label="Theme Switch" aria-pressed="false">
              <span class="theme-knob"></span>
            </button>
            <span class="theme-label">Dark</span>
          </div>
        </div>

        <h1 id="appTitle">WOOSIK'S MEETING MINUTE GENERATOR</h1>
        <p id="status" class="status-text">녹음을 시작하면 실시간 전사와 통역이 표시됩니다.</p>

        <div class="language-tabs" id="languageTabs">
          <button class="lang-tab active" data-lang="ko-KR">한국어</button>
          <button class="lang-tab" data-lang="en-US">English</button>
          <button class="lang-tab" data-lang="ja-JP">日本語</button>
          <button class="lang-tab" data-lang="zh-CN">中文</button>
        </div>
      </header>

      <section class="card flow-card">
        <div class="card-head">
          <h2><span class="step-chip">Step 1</span> 실시간 전사 시작</h2>
        </div>
        <div class="record-controls">
          <button id="recordBtn" class="record-btn" aria-label="Record Toggle">
            <span id="recordTimer">00:00.00</span>
          </button>
          <button id="refreshBtn" class="refresh-btn">Refresh</button>
        </div>
      </section>

      <section class="card transcript-card">
        <div class="card-head">
          <h2><span class="step-chip">Step 2</span> 실시간 전사 내용</h2>
        </div>

        <div class="dual-transcript">
          <div class="panel">
            <h3>원문 전사</h3>
            <textarea
              id="transcriptOriginal"
              placeholder="실시간 음성 전사가 여기에 표시됩니다."
              readonly
            ></textarea>
          </div>
          <div class="panel">
            <h3>한국어 통역</h3>
            <textarea
              id="transcriptKorean"
              placeholder="외국어 선택 시 한국어 통역이 여기에 표시됩니다."
              readonly
            ></textarea>
          </div>
        </div>

        <div class="step2-footer">
          <button id="notesBtn" class="accent">회의 요약 생성</button>
        </div>
      </section>

      <section class="card notes-card">
        <div class="card-head">
          <h2 id="notesTitle"><span class="step-chip">Step 3</span> 회의 요약 결과</h2>
          <button id="pdfBtn" class="secondary">PDF로 다운로드</button>
        </div>
        <div id="notesOutput" class="notes-output">아직 생성된 결과가 없습니다.</div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
