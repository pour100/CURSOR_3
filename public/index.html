<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meeting STT Recorder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="app-shell">
      <header class="card hero">
        <div class="hero-top">
          <span class="badge">Meeting Assistant</span>
          <span id="statusPill" class="status-pill idle">대기 중</span>
        </div>
        <h1>Speech-To-Text 회의 미팅기록</h1>
        <p>
          1) 녹음/업로드 후 전사, 2) 한 번 클릭으로 회의 요약 생성.
          모바일에서도 바로 사용할 수 있게 최적화된 화면입니다.
        </p>
        <p id="status" class="status-text">오디오를 녹음하거나 파일을 업로드하세요.</p>
      </header>

      <section class="card flow-card">
        <div class="card-head">
          <h2>Step 1. 전사 만들기</h2>
        </div>

        <div class="field">
          <label for="languageCode">언어 코드</label>
          <select id="languageCode">
            <option value="ko-KR" selected>ko-KR (한국어)</option>
            <option value="en-US">en-US (English)</option>
            <option value="ja-JP">ja-JP (日本語)</option>
          </select>
        </div>

        <div class="button-grid">
          <button id="startBtn" class="primary">녹음 시작</button>
          <button id="stopBtn" class="secondary" disabled>녹음 종료</button>
        </div>

        <div class="upload-wrap">
          <label for="audioFile">또는 오디오 파일 업로드</label>
          <input id="audioFile" type="file" accept="audio/*" />
          <button id="uploadBtn" class="primary">전사 실행</button>
        </div>
      </section>

      <section class="card transcript-card">
        <div class="card-head">
          <h2>Step 2. 전사 텍스트 확인</h2>
          <button id="notesBtn" class="accent">회의 요약 생성</button>
        </div>
        <textarea id="transcriptText" placeholder="전사 결과가 여기에 표시됩니다."></textarea>
      </section>

      <section class="card notes-card">
        <div class="card-head">
          <h2>Step 3. 회의 요약 결과</h2>
        </div>
        <pre id="notesOutput">아직 생성된 결과가 없습니다.</pre>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
