<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting STT Recorder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="card hero">
        <h1>Speech-To-Text 회의 미팅기록</h1>
        <p>브라우저 녹음 또는 파일 업로드 후, Google STT 전사와 Gemini 회의요약을 생성합니다.</p>
      </section>

      <section class="card controls">
        <div class="row">
          <label for="languageCode">언어 코드</label>
          <select id="languageCode">
            <option value="ko-KR" selected>ko-KR (한국어)</option>
            <option value="en-US">en-US (English)</option>
            <option value="ja-JP">ja-JP (日本語)</option>
          </select>
        </div>

        <div class="actions">
          <button id="startBtn">녹음 시작</button>
          <button id="stopBtn" disabled>녹음 종료</button>
        </div>

        <div class="upload">
          <label for="audioFile">또는 파일 업로드</label>
          <input id="audioFile" type="file" accept="audio/*" />
          <button id="uploadBtn">전사 실행</button>
        </div>

        <p id="status">대기 중</p>
      </section>

      <section class="card transcript">
        <div class="section-title">
          <h2>전사 텍스트</h2>
          <button id="notesBtn">회의 요약 생성</button>
        </div>
        <textarea id="transcriptText" placeholder="전사 결과가 여기에 표시됩니다."></textarea>
      </section>

      <section class="card notes">
        <h2>회의 요약 결과</h2>
        <pre id="notesOutput">아직 생성된 결과가 없습니다.</pre>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
